<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pomodoro</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Foco</p>
      <h1>Pomodoro</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Hoy <strong id="today">0</strong> min</p><h1 id="clock">25:00</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <div class="tabs">
        <button class="tab active" type="button" data-kind="foco" data-minutes="25">Foco 25</button>
        <button class="tab" type="button" data-kind="descanso" data-minutes="5">Descanso 5</button>
      </div>
      <div class="actions">
        <button id="toggle" class="primary" type="button">Empezar</button>
        <button id="reset" class="ghost" type="button">Reiniciar</button>
      </div>
      <p id="form-error" class="error" hidden></p>
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
